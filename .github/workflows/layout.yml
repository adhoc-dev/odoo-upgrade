name: Layout

on:
  pull_request:
  push:
    branches: [master]

jobs:
  root-folders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A rebase over the move keeps a PR's new files at their old path, where nothing runs them
      - name: Only the known folders at the root
        run: |
          allowed=".github .gitignore README.md lib modules scripts tests"
          unexpected=$(git ls-tree --name-only HEAD | grep -vxF -f <(tr ' ' '\n' <<< "$allowed") || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected at the root of the repo, move it under modules/, scripts/, lib/ or tests/:"
            echo "$unexpected"
            exit 1
          fi

  missing-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      # Runbot does not run every jump on every PR; this lists the scripts without their check on each push
      - name: Every script has its declarative check
        id: missing_checks
        # Reports only, until every script of 20 already in flight has its check or
        # its NO_CHECK; then this line goes and the job stops the PR.
        # On the step and not on the job: on the job the check still shows red.
        continue-on-error: true
        run: python3 tests/post_odu/missing_checks.py
      # The mergebot reads commit statuses, not check runs
      - name: Create commit status
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATE: ${{ steps.missing_checks.conclusion == 'success' && 'success' || 'failure' }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state="$STATE" -f context=mergebot/missing-checks

  branch-name:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Runbot takes the Odoo version from the branch prefix; without it the batch is green with no builds
      - name: Branch starts with the target Odoo version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if ! [[ "$HEAD_REF" =~ ^[0-9]+\.0- ]]; then
            echo "::error::Branch '$HEAD_REF' must start with the Odoo version it upgrades to, e.g. 19.0-t-12345-abc. Runbot reads the version from that prefix."
            exit 1
          fi
